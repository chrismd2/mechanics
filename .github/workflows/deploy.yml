name: Deploy to Production

on:
  pull_request:
    # synchronize = new commits pushed to the PR branch (required to redeploy updates)
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Job-wide: keep MIX_ENV=test so setup-beam / mix never load config/dev.exs.
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mechanics_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mechanics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.17.3'
        otp-version: '27'

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Run tests
      run: mix test

    - name: Set deployment variables
      id: set-vars
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "action=deploy_branch" >> $GITHUB_OUTPUT
          echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
        elif [ -n "${{ github.event.inputs.branch }}" ]; then
          echo "action=deploy_branch" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
        else
          echo "action=deploy_branch" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ vars.SERVER }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      if: steps.set-vars.outputs.action != 'skip'
      env:
        SERVER: ${{ vars.SERVER }}
        USER: ${{ vars.USER }}
        BRANCH: ${{ steps.set-vars.outputs.branch }}
      run: |
        ssh -o StrictHostKeyChecking=no $USER@$SERVER "
          set -e
          cd /root/mechanics/

          # Checkout the exact remote branch that triggered this deploy (PR head, main, or dispatch input)
          git fetch origin
          git checkout -B \"$BRANCH\" \"origin/$BRANCH\"
          git reset --hard \"origin/$BRANCH\"
          git clean -fd

          cd ~/christenson_server_host/
          make down mechanics
          make build mechanics
          make up mechanics
        "
