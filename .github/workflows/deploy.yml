name: Deploy to Production

on:
  pull_request:
    types: [opened]
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-wide: mix defaults to MIX_ENV=dev; keep test env for setup-beam / deps / mix test.
    # Server-side `make test mechanics` is obsolete — christenson_server_host now runs tests via
    # docker-compose.test.yml, which belongs in local/CI Docker, not on the prod deploy host.
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mechanics_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mechanics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.17.2'
        otp-version: '27'

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Run tests
      run: mix test

    - name: Set deployment variables
      id: set-vars
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "action=merge_branch" >> $GITHUB_OUTPUT
          echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
        elif [ -n "${{ github.event.inputs.branch }}" ]; then
          echo "action=deploy" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
        else
          echo "action=deploy" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ vars.SERVER }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      if: steps.set-vars.outputs.action != 'skip'
      env:
        SERVER: ${{ vars.SERVER }}
        USER: ${{ vars.USER }}
        ACTION: ${{ steps.set-vars.outputs.action }}
        BRANCH: ${{ steps.set-vars.outputs.branch }}
      run: |
        ssh -o StrictHostKeyChecking=no $USER@$SERVER "
          # Navigate to mechanics code directory
          cd /root/mechanics/

          if [ \"$ACTION\" == \"merge_branch\" ]; then
            git fetch origin
            git checkout main
            git merge origin/$BRANCH

            cd ~/christenson_server_host/
            make down mechanics
            make build mechanics
            make up mechanics
          elif [ \"$ACTION\" == \"rebuild_main\" ]; then
            git stash
            git checkout main
            git pull origin main

            cd ~/christenson_server_host/
            make down mechanics
            make build mechanics
            make up mechanics
          else
            git fetch origin
            git checkout $BRANCH
            git pull origin $BRANCH

            cd ~/christenson_server_host/
            make down mechanics
            make build mechanics
            make up mechanics
          fi
        "
